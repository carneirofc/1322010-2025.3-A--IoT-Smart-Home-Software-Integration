  title: CASA MONITORADA — ESPECIFICAÇÃO DE UM SISTEMA IOT DE AUTOMAÇÃO RESIDENCIAL, EFICIÊNCIA ENERGÉTICA E SEGURANÇA
  subtitle: "Atividade prática do Capítulo 5 — Projeto integrador de software IoT (Tema 3)"

  nature: >-
    Documento de especificação de software apresentado à disciplina Análise de
    Dados de Dispositivos IoT e de Sensores (1322010-2025.3-A), do Departamento
    de Ciência da Computação da Universidade Federal de Juiz de Fora.
  advisor: ""
  advisor-label: "Orientador:"

  city: Leopoldina-MG
  year: 2026

  resumo: >-
    Este documento especifica o software de um sistema de Internet das Coisas
    para uma residência com geração solar fotovoltaica conectada à rede. O
    sistema mede a energia trocada com a rede, a geração solar e as duas
    maiores cargas da residência, estima o custo da fatura e aciona cargas
    adiáveis (bomba da piscina, lavadora e iluminação externa) conforme o
    excedente de geração e o risco de sobrecarga do disjuntor geral. O sistema
    monitora também a segurança e a saúde do ambiente, com detecção de gás e
    de CO2 integrada ao alarme da casa e acompanhamento da tensão de
    fornecimento. A especificação apresenta o problema e os usuários, o
    dicionário de dados, a arquitetura de integração do sensor à aplicação,
    doze regras de negócio no formato SE/ENTÃO, a interface e a análise de
    riscos e resiliência. O protótipo visual consiste em uma aplicação Next.js
    com dados simulados. O projeto fundamenta-se nos conceitos de coleta,
    qualidade, armazenamento e integração de dados de sensores estudados na
    disciplina.
  palavras-chave: [Internet das Coisas, Automação residencial, Eficiência energética, Energia solar fotovoltaica, MQTT]

  abstract: >-
    This document specifies the software of an Internet of Things system for a
    home with grid-connected rooftop solar generation. The system measures the
    energy exchanged with the grid, the solar generation and the two largest
    loads of the house, estimates the electricity bill and switches deferrable
    loads (pool pump, washing machine and outdoor lights) according to surplus
    generation and the risk of overloading the main breaker. It also monitors
    the safety and health of the home, with gas and CO2 detection integrated
    with the house alarm and monitoring of the supply voltage. The
    specification covers the problem and its users, the data dictionary, the
    integration architecture from sensor to application, twelve IF/THEN
    business rules, the user interface and the risk and resilience analysis.
    The visual prototype is a Next.js application with simulated data. The
    design builds on the concepts of sensor data collection, quality, storage
    and integration studied in the course.
  keywords: [Internet of Things, Home automation, Energy efficiency, Solar photovoltaics, MQTT]

